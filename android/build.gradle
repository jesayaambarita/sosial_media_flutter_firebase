buildscript {
    ext.kotlin_version = '1.8.0'
    repositories {
        google()  // Menambahkan Google Maven repository
        mavenCentral()  // Menambahkan Maven Central repository
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'  // Pastikan versi ini sudah sesuai
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
        classpath 'com.google.gms:google-services:4.3.15'  // Tambahkan google-services plugin
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
